<script type="module">
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const cfg = { scene: +(q.get('scene') ?? 0), static: q.get('static') === '1', mobile: q.get('mobile') === '1', exp: q.get('export') || (location.pathname.includes('diorama-export') ? '1600x1000' : null) };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(cfg.exp ? 1 : Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.5, 200);
scene.add(new THREE.HemisphereLight(0xfff3df, 0x8a7a68, 0.95));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.position.set(7, 13, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });

const world = new THREE.Group(); scene.add(world);
const rig = new THREE.Group(); world.add(rig);

// ---------- helpers ----------
const mats = {};
const M = (c, o = {}) => { const k = c + JSON.stringify(o); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.92, metalness: 0, flatShading: true }, o))); };
const mesh = (g, m, x = 0, y = 0, z = 0, parent) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; (parent || rig).add(o); return o; };
const grp = (x = 0, y = 0, z = 0, parent) => { const g = new THREE.Group(); g.position.set(x, y, z); (parent || rig).add(g); return g; };
let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

function blobShape(r, n = 9, wobble = 0.34) {
  const pts = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, rr = r * (0.84 + rnd() * wobble); pts.push(new THREE.Vector3(Math.cos(a) * rr, Math.sin(a) * rr, 0)); }
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.6);
  return new THREE.Shape(curve.getPoints(72).map(p => new THREE.Vector2(p.x, p.y)));
}
function terrace(r, depth, color, y, x = 0, z = 0, opts = {}, parent) {
  const g = new THREE.ExtrudeGeometry(blobShape(r, opts.n || 9, opts.wobble), { depth, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 1, curveSegments: 12 });

}
const box = (w, h, d, c, x, y, z, p) => mesh(new THREE.BoxGeometry(w, h, d), M(c), x, y, z, p);

function hipRoof(w, d, h, c, x, y, z, p) { const g = new THREE.ConeGeometry(Math.SQRT1_2, h, 4); g.rotateY(Math.PI / 4); g.scale(w, 1, d); g.translate(0, h / 2, 0); return mesh(g, M(c), x, y, z, p); }

  return g; }

function pine(x, z, s) { const g = grp(x, G, z); cyl(0.05 * s, 0.08 * s, 0.6 * s, 6, 0x6B4A2B, 0, 0.3 * s, 0, g); [[0.5, 0.55, 0.45], [0.4, 0.5, 0.85], [0.28, 0.45, 1.2]].forEach(([r, h, y]) => mesh(new THREE.ConeGeometry(r * s, h * s, 6), M(0x3F5A46), 0, y * s, 0, g)); return g; }

function shade(hex, f) { const c = new THREE.Color(hex); c.r = f >= 1 ? c.r + (1 - c.r) * (f - 1) : c.r * f; c.g = f >= 1 ? c.g + (1 - c.g) * (f - 1) : c.g * f; c.b = f >= 1 ? c.b + (1 - c.b) * (f - 1) : c.b * f; return c.getHex(); }

function bridge(x, z, rot = 0, r = 0.78) { const g = grp(x, G + 0.05, z); g.rotation.y = rot; const H = 0.32; // deck arc rests on the banks, spans the pond

  [-0.15, 0.15].forEach(dz => { for (let i = 0; i <= 6; i++) { const a = Math.PI * i / 6; const px = Math.cos(a) * r, py = Math.sin(a) * H; cyl(0.012, 0.012, 0.16, 4, 0xA53420, px, py + 0.08, dz, g); } const rail = mesh(new THREE.TorusGeometry(r, 0.014, 4, 20, Math.PI), M(0xA53420), 0, 0.16, dz, g); rail.scale.set(1, H / r, 1); });
  [-1, 1].forEach(side => box(0.22, 0.1, 0.42, 0xD4BF96, side * (r + 0.02), 0.0, 0, g)); return g; }
function mountain(x, z, r, h, c) { const g = new THREE.ConeGeometry(r, h, 7, 2); const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); if (y < h / 2 - 0.01) { p.setX(i, p.getX(i) * (0.85 + rnd() * 0.3)); p.setZ(i, p.getZ(i) * (0.85 + rnd() * 0.3)); if (y > -h / 2 + 0.01) p.setY(i, y + (rnd() - 0.5) * h * 0.18); } } g.computeVertexNormals(); return mesh(g, M(c), x, G + h / 2 - 0.05, z); }
function path(points, w = 0.16, c = 0xD9C8A6) { const curve = new THREE.CatmullRomCurve3(points.map(([x, z]) => new THREE.Vector3(x, 0, z))); const m = mesh(new THREE.TubeGeometry(curve, 40, w, 6, false), M(c, { flatShading: false }), 0, G + 0.015, 0); m.scale.y = 0.18; m.castShadow = false; return m; }

const scenes = [[], [], [], []];

function S(i, fn) { const before = rig.children.length; fn(); const added = rig.children.slice(before); added.forEach((o, j) => {
  const p = new THREE.Group(); p.position.set(o.position.x, G, o.position.z); o.position.set(0, o.position.y - G, 0); rig.add(p); p.add(o);
  const box = new THREE.Box3().setFromObject(o); const sz = box.getSize(new THREE.Vector3());
  const cr = new THREE.Mesh(new THREE.CircleGeometry(0.5, 18), creaseMat.clone()); cr.rotation.x = -Math.PI / 2; cr.position.set(0, 0.012, -Math.max(0.2, sz.y * 0.35)); cr.scale.set(Math.max(0.5, sz.x * 0.9), Math.max(0.4, sz.y * 0.8), 1); cr.castShadow = false; cr.receiveShadow = false; p.add(cr);
  p.userData.crease = cr; p.userData.anim = { from: 0, to: 0, t0: -1, delay: j * 0.05, cur: 0 }; p.visible = false; scenes[i].push(p); }); }

S(1, () => { // Tokyo
  box(4.4, 0.16, 0.7, 0x8C8C96, 0, G + 0.08, -1.55);
